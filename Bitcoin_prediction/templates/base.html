<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Price Prediction</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <span class="text-bitcoin">₿</span>itcoin Predictor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if page == 'home' %}active{% endif %}" href="/">🏠 Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page == 'eda' %}active{% endif %}" href="/eda">📊 EDA</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page == 'live' %}active{% endif %}" href="/live">💰 Live Price</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page == 'analysis' %}active{% endif %}" href="/analysis">📈
                            Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page == 'prediction' %}active{% endif %}" href="/prediction">🔮
                            Prediction</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if page == 'about' %}active{% endif %}" href="/about">ℹ️ About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- TradingView Ticker Tape -->
    <div style="margin-top: 75px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                    {
                        "symbols": [
                            { "proName": "BITSTAMP:BTCUSD", "title": "BTC/USD" },
                            { "proName": "BITSTAMP:ETHUSD", "title": "ETH/USD" },
                            { "proName": "BINANCE:SOLUSDT", "title": "SOL/USDT" },
                            { "proName": "BINANCE:BNBUSDT", "title": "BNB/USDT" },
                            { "proName": "FX_IDC:USDINR", "title": "USD/INR" }
                        ],
                            "showSymbolLogo": true,
                                "colorTheme": "dark",
                                    "isTransparent": true,
                                        "displayMode": "adaptive",
                                            "locale": "in"
                    }
                </script>
        </div>
    </div>

    <div class="container main-content mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center py-4 mt-5 text-muted glass-footer">
        <small>© 2026 Bitcoin Predictor App. Powered by Flask & XGBoost.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
